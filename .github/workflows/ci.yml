name: CI — CESIZen

# Déclenché à chaque push sur main/develop et sur les PR vers main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Étape 1 : tests automatisés ─────────────────────────
  tests:
    name: Tests Pest
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source depuis GitHub
      - name: Checkout du code
        uses: actions/checkout@v7

      # Configure PHP 8.3 avec les extensions requises par Laravel
      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath

      # Met en cache les dépendances pour accélérer les runs suivants
      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # Installe les dépendances PHP via Composer
      - name: Installer les dépendances PHP
        run: composer install --no-progress --prefer-dist --no-interaction

      # Crée le .env et génère la clé applicative (tests SQLite en mémoire)
      - name: Préparer l'environnement
        run: cp .env.example .env && php artisan key:generate

      # Lance la suite de tests Pest (44 tests, SQLite en mémoire)
      - name: Lancer les tests
        run: composer test

  # ── Étape 2 : build de l'image Docker ───────────────────
  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: tests   # Ne s'exécute que si les tests passent

    steps:
      # Récupère le code source
      - name: Checkout du code
        uses: actions/checkout@v7

      # Construit l'image Docker (PHP + assets Vite + Composer prod)
      - name: Build Docker image
        run: docker build -t cesizen:${{ github.sha }} .
