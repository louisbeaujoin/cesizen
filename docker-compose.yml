services:

  # ── Application Laravel ──────────────────────────────────
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: CESIZen
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: cesizen
      DB_USERNAME: cesizen
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy

  # ── Base de données MySQL 8 ──────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cesizen
      MYSQL_USER: cesizen
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cesizen", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
